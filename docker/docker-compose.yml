version: '3.8'

services:
  trading-agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: trading-agent
    ports:
      - "5001:5001"
    volumes:
      - ../data:/app/data
      - ../logs:/app/data/logs
    env_file:
      - ../.env
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/data"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s